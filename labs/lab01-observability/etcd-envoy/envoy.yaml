# Envoy принимает подключения на 5432 и передаёт их по TCP на тот узел,
# который проходит HTTP-проверку GET /primary на порту 8008 (REST API Patroni).
# Patroni отвечает 200 только на лидере, реплика отвечает 503 - как в HAProxy.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: postgres
      address:
        socket_address: { address: 0.0.0.0, port_value: 5432 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: postgres
                cluster: postgres_primary
                idle_timeout: 1800s # как timeout client 30m в HAProxy

  clusters:
    - name: postgres_primary
      type: STRICT_DNS # адреса pg-master и pg-slave берутся из DNS Docker
      connect_timeout: 4s
      lb_policy: ROUND_ROBIN
      # как on-marked-down shutdown-sessions: рвать соединения с узлом, который перестал быть лидером
      close_connections_on_host_health_failure: true
      # если здоровых узлов нет, не слать трафик на все подряд (иначе запись может уйти на реплику)
      common_lb_config:
        healthy_panic_threshold: { value: 0 }
      health_checks:
        - timeout: 2s
          interval: 3s           # как inter 3s
          no_traffic_interval: 3s
          unhealthy_threshold: 3 # как fall 3
          healthy_threshold: 2   # как rise 2
          http_health_check:
            path: /primary
      load_assignment:
        cluster_name: postgres_primary
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: pg-master, port_value: 5432 }
                  health_check_config: { port_value: 8008 } # проверка идёт на порт REST API
              - endpoint:
                  address:
                    socket_address: { address: pg-slave, port_value: 5432 }
                  health_check_config: { port_value: 8008 }
